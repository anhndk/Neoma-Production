<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neoma — Production</title>
<!-- 🖋️ FONT SCRIPT (tulisan kaya kaligrafi/tulisan tangan) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     🔧 PENGATURAN GAMPANG (EDIT NENG KENE WAE)
     ============================================================ */
  :root{
    --accent: #ff5d3b;      /* werna utama (tombol, aksen, active) */
    --bg: #0e0e10;          /* werna background gelap */
    --card-bg: #17171a;     /* werna kertu/slide */
    --text: #f4f2ee;        /* werna tulisan */
    --muted: #9a9a9f;       /* werna tulisan sing luwih peteng */
    --radius: 18px;         /* mlengkung pojokan kertu */
    --slide-gap: 20px;      /* jarak antar slide */
    --slide-cyan: #22e6e6;      /* 🎨 werna hover tulisan script (tag) */
    --slide-desc-color: #ffffff; /* 🎨 werna tulisan deskripsi (h3) */
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 24px 6vw; gap:16px;
    flex-wrap: nowrap; /* supaya panah tetep neng tengen, ora mlumpat ngisor */
  }
  header .logo{
    width:130px; height:65px;     /* rasio 2:1 (horizontal) */
    flex: 0 0 auto;
    border-radius:14px;
    object-fit:contain;
    /* ganti src gambar ing HTML, utawa tinggal kothak iki yen durung ana logo */
    background: var(--bg);
    border: 0px dashed rgba(255,255,255,.2);
  }

  /* ---------- 🡄 🡆 TOMBOL PANAH ---------- */
  .nav-arrows{ display:flex; gap:10px; flex:0 0 auto; }
  .nav-arrows button{
    width:44px; height:44px; border-radius:50%;
    border:1px solid rgba(255,255,255,.15);
    background: var(--card-bg);
    color: var(--text);
    font-size:1.1rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .nav-arrows button:hover{ border-color: var(--accent); color: var(--accent); }
  .nav-arrows button:active{ transform: scale(.92); }

  /* ============================================================
     🎯 SLIDER — draggable, momentum, LOOP TANPA PEDHOT,
     lan "center-focus": sing ditengah dadi highlight.
     ============================================================ */

  .slider-wrap{
    padding: 34px 0 30px;
    cursor: grab;
    overflow: hidden; /* wajib, supaya clone ora katon mlembar */
  }
  .slider-wrap.dragging{ cursor: grabbing; }

  .slider-track{
    display: flex;
    align-items:center;
    gap: var(--slide-gap);
    user-select: none;
    -webkit-user-select: none;
    touch-action: pan-y;
    will-change: transform;
  }

  .slide{
    flex: 0 0 auto;
    width: 460px;                 /* ukuran kabeh slide, SERAGAM lan luwih gedhe */
    aspect-ratio: 3 / 4.3;        /* luwih duwur, dadi kiwa-tengene ketok gedhe */
    border-radius: var(--radius);
    background: var(--card-bg);
    overflow: hidden;
    position: relative;
    display:block;
    transition: opacity .35s ease;
  }

  @media (max-width: 720px){

    header{ padding:18px 5vw; gap:10px; }
    header .logo{ width:96px; height:48px; border-radius:11px; }
    .nav-arrows button{ width:38px; height:38px; font-size:1rem; }

    .slider-wrap{ padding:20px 0 24px; }
    .slider-track{ gap:14px; }

    .slide{
      width:60vw;
      aspect-ratio:3 / 4.5;
      border-radius:22px;
    }
  }

  .slide img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    pointer-events:none;
    transition: filter .4s ease, opacity .4s ease;
  }

  /* -------- ⭐ IKI SING NGATUR "CENTER-FOCUS" -------- */
  /* Sisih kiwa-tengen: grayscale + rada peteng */
  .slide:not(.active) img{
    filter: grayscale(1);
    opacity: .55;
  }
  /* Sing ditengah: warna asli, deskripsi katon */
  .slide.active img{
    filter: grayscale(0);
    opacity: 1;
  }

  .slide .cap{
    position:absolute; left:0; right:0; bottom:0;
    padding: 18px;
    background: linear-gradient(to top, rgba(0,0,0,.75), transparent);
    pointer-events:none;
    opacity: 0;                 /* deskripsi didhelikake dhisik... */
    transform: translateY(22px);
    transition: opacity .3s ease, transform .3s ease;   /* pas ilang: cepet */
  }
  .slide.active .cap{
    opacity: 1;                 /* ...banjur mung katon pas active */
    transform: translateY(0);
    transition: opacity .4s ease .12s, transform .4s ease .12s; /* pas metu: rada telat + alus, dadi katon "muncul saka ngisor" */
  }
  /* ---- 🔗 "tag" saiki dadi link script, gedhe, putih, hover cyan ---- */
  .slide .cap .tag a{
    font-family: 'Alex Brush', cursive;
    font-size: 1.9rem;
    line-height: 1;
    color: #ffffff;
    font-weight: 400;
    text-decoration: none;
    pointer-events: auto;    /* mung tulisan iki sing bisa diklik */
    display: inline-block;
    transition: color .25s ease;
  }
  .slide .cap .tag a:hover{
    color: var(--slide-cyan);   /* ora underline, mung ganti werna */
  }

  /* ---- deskripsi (biyen judul) saiki mung teks, cilik lan thin ---- */
  .slide .cap h3{
    font-size: .78rem;
    font-weight: 300;
    letter-spacing: .01em;
    color: var(--slide-desc-color);
    margin-top: 2px;
  }

  /* ---------- 🔘 GARIS PROGRESS + BUNDERAN ---------- */
  .nav-progress{
    position: relative;
    height: 2px;
    background: rgba(255,255,255,.14);
    margin: 32px 6vw 0;
    border-radius: 2px;
  }
  .nav-progress-fill{
    position:absolute; top:0; left:0; height:100%;
    background: var(--accent);
    border-radius: 2px;
    width: 0%;
    transition: width .5s cubic-bezier(.2,.8,.2,1);
  }
  .nav-progress-dot{
    position:absolute; top:50%; left:0%;
    width:13px; height:13px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--bg);
    transform: translate(-50%,-50%);
    transition: left .5s cubic-bezier(.2,.8,.2,1);
  }

  /* ---------- 🏷️ NAVIGASI LABEL ING NGISOR ----------
     Wigati: .nav-item nduweni WIDTH lan GAP sing PERSIS PADHA karo .slide,
     lan navTrack di-transform BARENG karo sliderTrack (transform sing
     padha persis) -> label "nempel" pas ing ngisor slide-e, dawane podho. */
  .nav-wrap{
    overflow: hidden;
    margin: 14px 0 0;
  }
  .nav-track{
    display:flex;
    gap: var(--slide-gap);
    will-change: transform;
  }
  .nav-item{
    flex: 0 0 auto;
    width: 460px;                 /* 🔒 KUDU PADHA karo .slide{ width } */
    text-align:center;
    padding: 4px 8px 0;
    cursor:pointer;
    color: var(--muted);
    font-size:.85rem;
    background:none; border:none; font-family:inherit;
    text-decoration:none;
    transition: color .3s ease;
  }
  .nav-item.active{ color: var(--accent); }

  /* ⚠️ media query iki KUDU ana SAWISE aturan .nav-item ing ndhuwur,
     supaya menang pas ing HP (yen diselehke sadurunge, bakal kalah) */
  @media (max-width: 720px){
    .nav-track{ gap:14px; }
    .nav-item{ width:60vw; font-size:.72rem; }
    .nav-progress{ margin: 24px 5vw 0; }
  }

  /* ---------- © FOOTER ---------- */
  footer{
    text-align: center;
    padding: 40px 6vw 28px;
    color: var(--muted);
    font-size: .8rem;
  }

</style>
</head>
<body>

  <header>
    <!-- ✏️ GANTI src IKI KARO GAMBAR LOGOMU (rasio 2:1, contone 400x200px) -->
    <img class="logo" src="images/neoma_logo_clr.png" alt="Logo">
    <div class="nav-arrows">
      <button id="prevBtn" aria-label="Sadurunge">←</button>
      <button id="nextBtn" aria-label="Sabanjure">→</button>
    </div>
  </header>

  <!-- ============================================================
       ✏️ EDIT KONTEN SLIDE NENG KENE
       - <a href="...">Alam</a>  ing njero .tag  -> iki sing bisa diklik, ngarah menyang page
       - <h3>Segara Wengi</h3>   -> iki mung deskripsi, ora bisa diklik
       - class="slide"      -> ukuran kabeh slide wis seragam, ganti neng CSS .slide{ width: ... }
       - src="..."          -> gambar
       - data-label="..."   -> tulisan sing katon ing navigasi ngisor
       ============================================================ -->
  <div class="slider-wrap" id="sliderWrap">
    <div class="slider-track" id="sliderTrack">

      <div class="slide" data-label="Wedding Invitation">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=800&q=80" alt="">
        <div class="cap"><div class="tag"><a href="katalog.html">Wedding Invitation</a></div><h3>Cetak Undangan Pernikahan</h3></div>
      </div>

      <div class="slide" data-label="Web Wedding Invitation">
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=800&q=80" alt="">
        <div class="cap"><div class="tag"><a href="halaman-kutha.html">Web Wedding Invitation</a></div><h3>Undangan Pernikahan Berbasis Web</h3></div>
      </div>

      <div class="slide" data-label="Percetakan">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80" alt="">
        <div class="cap"><div class="tag"><a href="halaman-gunung.html">Percetakan</a></div><h3>Layanan Percetakan</h3></div>
      </div>

      <div class="slide" data-label="Branding">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=800&q=80" alt="">
        <div class="cap"><div class="tag"><a href="halaman-alas.html">Branding & Digital Marketing</a></div><h3>Layanan Branding & Digital Marketing</h3></div>
      </div>

      <div class="slide" data-label="Kontak">
        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&q=80" alt="">
        <div class="cap"><div class="tag"><a href="halaman-pantai.html">Kontak</a></div><h3>Hubungi Kami</h3></div>
      </div>

    </div>
  </div>

  <!-- 🔘 GARIS PROGRESS + INDIKATOR BUNDER (koyo conto gambar) -->
  <div class="nav-progress">
    <div class="nav-progress-fill" id="navFill"></div>
    <div class="nav-progress-dot" id="navDot"></div>
  </div>

  <div class="nav-wrap" id="navWrap">
    <div class="nav-track" id="navTrack"></div>
  </div>

  <!-- ✏️ EDIT TULISAN COPYRIGHT NENG KENE -->
  <footer>&copy; Neoma Production 2026</footer>

<script>
/* ============================================================
   🧠 LOGIKA SLIDER
   - Drag + momentum + loop tanpa pedhot (koyo sadurunge)
   - BARU: "center-focus" -> slide sing paling cedhak tengah
     layar dadi .active (warna + deskripsi katon), liyane
     grayscale. Sawise dilepas/mandheg, otomatis "nyemplak"
     (snap) supaya slide sing paling cedhak ana persis tengah.
   - BARU: tombol panah + navigasi label ing ngisor.
   ============================================================ */
(function(){
  const wrap   = document.getElementById('sliderWrap');
  const track  = document.getElementById('sliderTrack');
  const navTrack = document.getElementById('navTrack');
  const navFill  = document.getElementById('navFill');
  const navDot   = document.getElementById('navDot');
  const prevBtn= document.getElementById('prevBtn');
  const nextBtn= document.getElementById('nextBtn');
  const originalSlides = Array.from(track.children);
  const N = originalSlides.length;

  // ---------- PENGATURAN (silakan diedit) ----------
  const DRAG_SPEED = 1;
  const CLICK_THRESHOLD = 6;   // px — gesere kurang saka iki dianggep KLIK, ora drag
  const FLING_VELOCITY = 8;    // secepet apa flick-e ben oleh "bonus" mlumpat siji slide ekstra
  const HYSTERESIS = 0.12;     // 0–0.5 : luwih gedhe = luwih angel gonta-ganti active pas isih drag (ngirangi "blink")
  const AUTOPLAY_MS = 4000;    // 🔁 saben pira detik pindah dhewe (4000 = 4 detik)
  // ----------------------------------------------------------

  // ---------- GAWE LOOP: clone sadurunge lan sawise ----------
  // PENTING: clone kudu diselehke KANTHI URUTAN SING PADHA karo asline.
  // Nganggo documentFragment supaya urutane ora kebalik pas diselehke
  // ing ngarep (bug sadurunge: insertBefore bola-bali gawe urutan
  // "before" kebalik, akibate konten loop dadi salah lan "mlumpat dhewe").
  function cloneSetFragment(){
    const frag = document.createDocumentFragment();
    originalSlides.forEach(s => frag.appendChild(s.cloneNode(true)));
    return frag;
  }
  track.insertBefore(cloneSetFragment(), track.firstChild);
  track.appendChild(cloneSetFragment());
  // saiki track.children isine 3×N: [before][asli][after], KABEH URUTANE SEPADHAN

  const allSlides = () => Array.from(track.children);

  // ---------- GAWE NAVIGASI LABEL: STRUKTUR PADHA PERSIS KARO SLIDE ----------
  // (3×N: [before][asli][after]) supaya bisa "nempel" digeser bareng
  function buildNavItem(s, i){
    const a = document.createElement('a');
    a.className = 'nav-item';
    a.textContent = s.dataset.label || ('Slide ' + (i+1));
    // 🔗 njupuk link sing padha karo judul (.tag a) ing slide sing cocog
    const titleLink = s.querySelector('.cap .tag a');
    a.href = titleLink ? titleLink.getAttribute('href') : '#';
    return a;
  }
  const originalNavItems = originalSlides.map(buildNavItem);
  function navCloneFragment(){
    const frag = document.createDocumentFragment();
    originalNavItems.forEach(el => frag.appendChild(el.cloneNode(true)));
    return frag;
  }
  navTrack.appendChild(navCloneFragment()); // before
  navTrack.appendChild(navCloneFragment()); // asli
  navTrack.appendChild(navCloneFragment()); // after
  // pasang event klik neng saben instance: langsung ngarah menyang page
  // (persis kaya link judul ing njero slide) — ora nyegah navigasi standar
  Array.from(navTrack.children).forEach((a, absIdx) => {
    a.addEventListener('click', () => { goToIndex(absIdx, true); resetAutoplay(); });
  });
  const navAllItems = () => Array.from(navTrack.children);

  let step = 0;           // jarak antar slide (kabeh slide wis podho ukurane)
  let centerOffsets = [];  // 🚀 CACHE: posisi "tengah" saben slide, diitung SEPISAN wae
                            // (dudu saben frame pas drag) — iki sing ngilangi rasa "abot/ngelag"
  let currentIndex = N;   // posisi aktif sing wis "ngunci" (settled), miwiti ing set tengah
  let liveActiveIdx = N;  // posisi aktif sing katon nyata-nyata pas isih drag
  let posX = 0, startX = 0, startPosX = 0, isDown = false;
  let velocity = 0, lastX = 0, lastT = 0;
  let movedDistance = 0;
  let pendingFixTimeout = null;

  function measure(){
    // maca layar (offsetLeft) MUNG ing kene, sepisan wae, banjur diselehke
    // ing array. Sabanjure kabeh itungan mung nganggo angka sing wis
    // kasimpen iki (tanpa maca layar maneh) — luwih entheng kanggo HP.
    step = track.children[N + 1].offsetLeft - track.children[N].offsetLeft;
    const wrapCenter = wrap.clientWidth / 2;
    const firstEl = track.children[0];
    const firstCenter = wrapCenter - (firstEl.offsetLeft + firstEl.offsetWidth / 2);
    centerOffsets = [];
    for(let i = 0; i < track.children.length; i++){
      centerOffsets.push(firstCenter - i * step);
    }
  }

  // titik transform supaya slide index `i` pas ing tengah slider-wrap
  // (saiki mung njupuk saka cache, dudu maca layar maneh)
  function centerOffset(i){
    return centerOffsets[i];
  }

  function setTransition(value){
    track.style.transition = value;
    navTrack.style.transition = value;   // 🔗 transisi uga disebar bareng menyang label
  }

  function setX(x){
    posX = x;
    const t = `translate3d(${posX}px,0,0)`;
    track.style.transform = t;
    navTrack.style.transform = t;   // 🔗 label ditransform PADHA PERSIS -> mesthi nempel
  }

  function computeNearest(posXValue){
    let bestIdx = 0, bestDist = Infinity;
    for(let i = 0; i < centerOffsets.length; i++){
      const dist = Math.abs(centerOffsets[i] - posXValue);
      if(dist < bestDist){ bestDist = dist; bestIdx = i; }
    }
    return bestIdx;
  }

  function applyActive(idx){
    allSlides().forEach((el, i) => el.classList.toggle('active', i === idx));
    navAllItems().forEach((el, i) => el.classList.toggle('active', i === idx));
    updateProgress(((idx % N) + N) % N);
  }

  // versi "instan" — dienggo pas lompatan loop sing kudune ORA KATON.
  // Iki mateni transisi cap sedhela wae ben tulisan ora melu nge-fade
  // in/out pas swap DOM (clone -> asli), sing sadurunge nyebabke "kedip".
  function applyActiveInstant(idx){
    allSlides().forEach((el, i) => {
      const shouldBeActive = (i === idx);
      if(el.classList.contains('active') !== shouldBeActive){
        const cap = el.querySelector('.cap');
        if(cap) cap.style.transition = 'none';
        el.classList.toggle('active', shouldBeActive);
        if(cap){ void cap.offsetWidth; cap.style.transition = ''; }
      }
    });
    navAllItems().forEach((el, i) => el.classList.toggle('active', i === idx));
    updateProgress(((idx % N) + N) % N);
  }

  // 🔘 mindhah bunderan + ngisi garis progress miturut slide asli
  // sing lagi aktif saiki (0..N-1)
  function updateProgress(realIdx){
    const pct = N > 1 ? (realIdx / (N - 1)) * 100 : 0;
    navDot.style.left = pct + '%';
    navFill.style.width = pct + '%';
  }

  // dipanggil pas isih drag: mung ganti "active" yen jelas-jelas wis luwih
  // cedhak (nganggo hysteresis), supaya ora gonta-ganti kesusu -> ora blink
  function refreshActiveLive(){
    const candidate = computeNearest(posX);
    if(candidate !== liveActiveIdx){
      const distCandidate = Math.abs(centerOffset(candidate) - posX);
      const distCurrent   = Math.abs(centerOffset(liveActiveIdx) - posX);
      if(distCurrent - distCandidate > step * HYSTERESIS){
        liveActiveIdx = candidate;
      }
    }
    applyActive(liveActiveIdx);
  }

  function goToIndex(i, withTransition){
    currentIndex = i;
    liveActiveIdx = i;
    if(pendingFixTimeout){ clearTimeout(pendingFixTimeout); pendingFixTimeout = null; }
    setTransition(withTransition
      ? 'transform .55s cubic-bezier(.2,.8,.2,1)'
      : 'none');
    setX(centerOffset(i));
    if(withTransition){
      applyActive(i);
      pendingFixTimeout = setTimeout(()=>{
        setTransition('');
        fixLoopRange();
        pendingFixTimeout = null;
      }, 560);
    } else {
      applyActiveInstant(i);
      requestAnimationFrame(()=> setTransition(''));
    }
  }

  // yen currentIndex wis kejlungup metu saka "set tengah", tarik meneh
  // diam-diam (tanpa transisi/katon) supaya loop-e ora entek stok clone
  function fixLoopRange(){
    let shifted = false;
    if(currentIndex < N){
      currentIndex += N; shifted = true;
    } else if(currentIndex >= N * 2){
      currentIndex -= N; shifted = true;
    }
    if(shifted){
      setTransition('none');
      setX(centerOffset(currentIndex));
      liveActiveIdx = currentIndex;
      applyActiveInstant(currentIndex);
      requestAnimationFrame(()=> setTransition(''));
    }
  }

  function pointerDown(e){
    isDown = true;
    movedDistance = 0;
    wrap.classList.add('dragging');
    stopAutoplay();
    if(pendingFixTimeout){ clearTimeout(pendingFixTimeout); pendingFixTimeout = null; }
    setTransition('');
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX;
    startPosX = posX;
    lastX = p.clientX;
    lastT = Date.now();
    velocity = 0;
  }

  function pointerMove(e){
    if(!isDown) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = (p.clientX - startX) * DRAG_SPEED;
    movedDistance = Math.abs(dx);
    setX(startPosX + dx);
    refreshActiveLive();

    const now = Date.now();
    const dt = now - lastT;
    if(dt > 0){
      velocity = (p.clientX - lastX) / dt * 16;
      lastX = p.clientX;
      lastT = now;
    }
  }

  // ---------- IKI SING NGGANTI "MOMENTUM MLAKU DHEWE" ----------
  // Saiki, pas dilepas, langsung diitung PISAN slide endi sing dituju
  // (adhedasar adoh-e geseran + kecepetan pungkasan), banjur langsung
  // "nyemplak" siji transisi alus menyang kono. Ora ana maneh gerakan
  // bebas sing bisa kebablasen terus kudu mbalik.
  function pointerUp(){
    if(!isDown) return;
    isDown = false;
    wrap.classList.remove('dragging');

    // sepira "persen" lebar siji slide sing wis kok geser (bisa desimal,
    // contone 0.3 tegese lagi 30% dalan menyang slide sabanjure)
    const rawDelta = -(posX - startPosX) / step;
    const base = Math.trunc(rawDelta);
    const frac = rawDelta - base;

    // ⚙️ SWIPE_THRESHOLD: sepira % lebar slide sing dibutuhake ben dianggep
    // "pindah". 0.22 tegese cukup geser ~22% lebar slide wae, ORA KUDU
    // nganti tengah. Cilikke angka iki ben luwih "entheng/gampang mlaku",
    // gedhekke ben luwih "kenceng/kudu digeser tenanan".
    const SWIPE_THRESHOLD = 0.22;
    let indexShift = base;
    if(Math.abs(frac) >= SWIPE_THRESHOLD){
      indexShift += Math.sign(frac);
    }

    // flick cepet: senajan gesermu cendhak, nek kenceng tetep dianggep pindah
    if(indexShift === 0 && Math.abs(velocity) > FLING_VELOCITY){
      indexShift = velocity < 0 ? 1 : -1;
    }

    indexShift = Math.max(-3, Math.min(3, indexShift));

    goToIndex(currentIndex + indexShift, true);
    resetAutoplay();
  }

  // Mouse
  wrap.addEventListener('mousedown', pointerDown);
  window.addEventListener('mousemove', pointerMove);
  window.addEventListener('mouseup', pointerUp);

  // Touch (HP)
  wrap.addEventListener('touchstart', pointerDown, { passive:true });
  wrap.addEventListener('touchmove', pointerMove, { passive:true });
  wrap.addEventListener('touchend', pointerUp);

  // ---------- MISAHKE "KLIK TAG" KARO "DRAG" ----------
  track.querySelectorAll('.cap .tag a').forEach(a=>{
    a.addEventListener('click', (e)=>{
      if(movedDistance >= CLICK_THRESHOLD){ e.preventDefault(); }
    });
    a.addEventListener('dragstart', e=> e.preventDefault());
  });

  // ---------- TOMBOL PANAH ----------
  prevBtn.addEventListener('click', ()=>{ goToIndex(currentIndex - 1, true); resetAutoplay(); });
  nextBtn.addEventListener('click', ()=>{ goToIndex(currentIndex + 1, true); resetAutoplay(); });

  // ---------- 🔁 AUTOPLAY (saben AUTOPLAY_MS, pindah dhewe menyang sabanjure) ----------
  let autoplayTimer = null;
  function startAutoplay(){
    stopAutoplay();
    autoplayTimer = setInterval(()=>{
      goToIndex(currentIndex + 1, true);
    }, AUTOPLAY_MS);
  }
  function stopAutoplay(){
    if(autoplayTimer){ clearInterval(autoplayTimer); autoplayTimer = null; }
  }
  function resetAutoplay(){
    stopAutoplay();
    startAutoplay();
  }
  // mandheg pas jempol/mouse ana ing slider utawa lagi di-hover, mlaku maneh pas lunga
  wrap.addEventListener('mouseenter', stopAutoplay);
  wrap.addEventListener('mouseleave', startAutoplay);

  // ---------- POSISI AWAL ----------
  function init(){
    measure();
    goToIndex(N, false); // miwiti pas slide asli sing pisanan, ing tengah
    startAutoplay();
  }
  window.addEventListener('load', init);
  window.addEventListener('resize', ()=>{ measure(); goToIndex(currentIndex, false); });
  if(document.readyState === 'complete') init();
})();
</script>
</body>
</html>
